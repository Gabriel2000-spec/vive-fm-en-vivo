    <style>
                body {
            /* Imagen de fondo premium comercial enfocada en música y ondas de sonido */
            background: linear-gradient(rgba(13, 13, 19, 0.1), rgba(13, 13, 19, 0.19)),

        /* Botón de reproducción maestro */
        .master-play-btn {

        /* Forma de dos barras verticales cuando esté en pausa */

        /* Contenedor Principal Ajustable a Móviles */

        /* Estado inactivo (Mensaje en color Rojo si no hay actividad) */

        }

        /* Estado activo (Mensaje en color Verde si hay actividad) */
        .state-has-activity {

        /* [CONTINUACIÓN DESDE LOS ESTILOS] */

        /* 4. PIE DE PÁGINA (ÚLTIMO DE LA WEB) */

    </style>

<body>

    <!-- Elemento Nativo del Streaming de Audio -->
    <audio id="liveAudioSource" src=" https://stream.zeno.fm/ctv5k5brgpfvv" preload="true"></audio>

    <!-- Lógica de Funcionamiento en JavaScript -->
    <script>
           
        // --- CONFIGURACIÓN DE TUS EMISORAS ---
        // Pegar aquí tu URL de Zeno Radio (Reemplaza esta de ejemplo por la tuya oficial)
        const URL_ZENO_RESPALDO = " "; 
        const URL_PRINCIPAL_LIVE = "http://uk20freenew.listen2myradio.com:39849/stream ";

        const audioInstance = document.getElementById('liveAudioSource');
        const visualEqualizer = document.getElementById('visualEqualizer');
        const volumeController = document.getElementById('volumeController');
        const playbackTime = document.getElementById('playbackTime');
        const activityNoticeBanner = document.getElementById('activityNoticeBanner');
        const signalLive = document.getElementById('signalLive');
        const signalOffline = document.getElementById('signalOffline');

        let chronologicalTimer;
        let countSeconds = 0;
        let usandoRespaldo = false;

        // Recuperar configuraciones desde LocalStorage al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const cacheColor = localStorage.getItem('viveFm_color') || '#00f0ff';
            const cacheVolume = localStorage.getItem('viveFm_vol') || 0.8;

            applyTheme(cacheColor);
            volumeController.value = cacheVolume;
            audioInstance.volume = cacheVolume;

            toggleBannerAndStreamingUI(false);
            refreshMeta();
            
            setInterval(refreshMeta, 18000); 
        });

        // Manejar el Streaming de Audio con Detección Automática de Caídas
        function processPlayback() {
            const playButtonElement = document.getElementById('masterPlayBtn');
            
            if (audioInstance.paused) {
                // Primero intentamos conectar al streaming principal en vivo
                audioInstance.src = URL_PRINCIPAL_LIVE;
                audioInstance.load();
                usandoRespaldo = false;
                
                audioInstance.play().then(() => {
                    activarInterfazReproduccion(playButtonElement);
                }).catch(error => {
                    console.log("Señal principal fuera del aire. Conectando a Zeno Radio...");
                    conectarStreamingRespaldo(playButtonElement);
                });
            } else {
                detenerInterfazReproduccion(playButtonElement);
            }
        }

        // Función para conectar al stream de Zeno Radio secundario
        function conectarStreamingRespaldo(button) {
            audioInstance.src = URL_ZENO_RESPALDO;
            audioInstance.load();
            usandoRespaldo = true;

            audioInstance.play().then(() => {
                activarInterfazReproduccion(button);
            }).catch(err => {
                console.error("Ambos streamings están inaccesibles en este momento:", err);
                detenerInterfazReproduccion(button);
            });
        }

        function activarInterfazReproduccion(button) {
            button.classList.add('playing');
            visualEqualizer.classList.add('active');
            runClock();
            toggleBannerAndStreamingUI(true);
            refreshMeta();
        }

        function detenerInterfazReproduccion(button) {
            audioInstance.pause();
            button.classList.remove('playing');
            visualEqualizer.classList.remove('active');
            stopClock();
            toggleBannerAndStreamingUI(false);
            refreshMeta();
        }

        // Controlar y guardar el volumen
        function changeVolume(amount) {
            audioInstance.volume = amount;
            localStorage.setItem('viveFm_vol', amount);
        }

        // Sistema de cambio de color del reproductor con almacenamiento local
        function applyTheme(hex) {
            document.documentElement.style.setProperty('--primary-color', hex);
            let glowRgb = hexToRgbAlpha(hex, 0.25);
            document.documentElement.style.setProperty('--border-glow', glowRgb);
            localStorage.setItem('viveFm_color', hex);

            document.querySelectorAll('.color-opt').forEach(circle => {
                circle.classList.remove('active');
                if (circle.style.backgroundColor === hex || rgbToHexFormat(circle.style.backgroundColor) === hex.toLowerCase()) {
                    circle.classList.add('active');
                }
            });
        }

        // Sincronización del Banner y los Estados según la actividad real detectada
        function toggleBannerAndStreamingUI(isPlaying) {
            if (isPlaying) {
                if (!usandoRespaldo) {
                    // SEÑAL PRINCIPAL TRANSMITIENDO (Locutor en cabina)
                    signalLive.style.display = "flex";
                    signalOffline.style.display = "none";
                    activityNoticeBanner.className = "info-activity-banner state-has-activity";
                    activityNoticeBanner.textContent = "Mensaje: Transmitiendo Actividad en Vivo desde la Cabina Principal.";
                } else {
                    // LOCUTOR FUERA / SUENA EL DJ AUTOMÁTICO DE ZENO RADIO
                    signalLive.style.display = "none";
                    signalOffline.style.display = "flex"; // Cambia a Verde "Fuera del Aire"
                    activityNoticeBanner.className = "info-activity-banner state-no-activity"; // Cambia a Rojo
                    activityNoticeBanner.textContent = "Mensaje: Cabina inactiva. Escuchas Auto-DJ Programado (Zeno).";
                }
            } else {
                // REPRODUCTOR PAUSADO COMPLETAMENTE POR EL OYENTE
                signalLive.style.display = "none";
                signalOffline.style.display = "flex";
                activityNoticeBanner.className = "info-activity-banner state-no-activity";
                activityNoticeBanner.textContent = "Mensaje: No hay actividad en la cabina actualmente.";
            }
        }

        // Cronómetro de tiempo de escucha
        function runClock() {
            chronologicalTimer = setInterval(() => {
                countSeconds++;
                let h = Math.floor(countSeconds / 3600);
                let m = Math.floor((countSeconds % 3600) / 60);
                let s = countSeconds % 60;
                playbackTime.textContent = `${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
            }, 1000);
        }

        function stopClock() {
            clearInterval(chronologicalTimer);
        }

        // Rotación de metadatos según la señal que esté sonando
        function refreshMeta() {
            if (!audioInstance.paused) {
                if (!usandoRespaldo) {
                    document.getElementById('songTitle').textContent = "Señal en Vivo";
                    document.getElementById('artistName').textContent = "Vive FM - Cabina Central";
                } else {
                    document.getElementById('songTitle').textContent = "Programación Automatizada";
                    document.getElementById('artistName').textContent = "Vive FM - Auto DJ Plataforma";
                }
            } else {
                document.getElementById('songTitle').textContent = "Señal en Pausa";
                document.getElementById('artistName').textContent = "Vive FM Estación";
            }
        }

        // Funciones auxiliares para traducción de formatos de color
        function hexToRgbAlpha(hex, alpha) {
            let c = hex.substring(1).split('');
            if(c.length === 3) c = [c, c, c, c, c, c];
            let num = parseInt(c.join(''), 16);
            return `rgba(${(num>>16)&255}, ${(num>>8)&255}, ${num&255}, ${alpha})`;
        }

        function rgbToHexFormat(rgb) {
            if (!rgb) return '';
            const match = rgb.match(/\d+/g);
            if (!match) return rgb;
            return "#" + match.slice(0, 3).map(x => {
                const hex = parseInt(x).toString(16);
                return hex.length === 1 ? "0" + hex : hex;
            }).join("");
        }
    </script>
